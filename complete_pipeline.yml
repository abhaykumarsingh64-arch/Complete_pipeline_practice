pool: Abhayagentpool
trigger:
- main
- feauture/*

stages:
- stage:
  displayName: Init & Validate
  jobs:
  - job:
    steps:
    - task: TerraformTask@5
      displayName: Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Parent_module'
        backendServiceArm: 'mk-app-reg'
        backendAzureRmStorageAccountName: 'dreampipelinestg'
        backendAzureRmContainerName: 'dreampipelinecontainer'
        backendAzureRmKey: 'prod.tfsate'
    - powershell: |
        Write-Host "Terraform version:"
        terraform version

        Write-Host "Terraform location:"
        where.exe terraform

        Write-Host "PATH:"
        $env:PATH
      displayName: "Check Terraform on Agent"
    
    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Parent_module'
   
- stage: 
  displayName: Terrafrom Scan
  jobs:
  - job: 
    steps:
    - task: AzurePowerShell@5
      inputs:
        ScriptType: 'InlineScript'
        Inline: 'tflint /recursive'

    